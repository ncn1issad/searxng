<section id="suggestions" role="complementary" aria-labelledby="suggestions-title">
    <h2 class="title" id="suggestions-title">{{ _('Searches related to') }} <strong>{{ q|e }}</strong></h2>
    <ul class="wrapper">
      {%- for suggestion in suggestions -%}
      <li><form method="{{ method }}" action="{{ url_for('search') }}">
          <input type="hidden" name="q" value="{{ suggestion.url }}">
          {%- for category in selected_categories -%}
            <input type="hidden" name="category_{{ category }}" value="1">
          {%- endfor -%}
          <input type="hidden" name="language" value="{{ current_language }}">
          <input type="hidden" name="time_range" value="{{ time_range }}">
          <input type="hidden" name="safesearch" value="{{ safesearch }}">
          <input type="hidden" name="theme" value="{{ theme }}">
          {%- if timeout_limit -%}
            <input type="hidden" name="timeout_limit" value="{{ timeout_limit|e }}" >
          {%- endif -%}
          <input type="submit" class="suggestion" role="link" value="{{ suggestion.title }}">
      </form></li>
      {%- endfor -%}
    </ul>
</section>
